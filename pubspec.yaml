name: portable_ai_flutter
description: "Portable AI — Run uncensored local LLMs natively on any device."
publish_to: 'none'
version: 1.1.0+2

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter

  # ── LLM Engine ──────────────────────────────────────────────────
  # Was pub.dev ^0.8.24 (bumped from 0.6.10 for the public speculative-
  # decoding API — n-gram self-speculative strategies need no second
  # model at all, plus real draft-model strategies). Now pinned to a git
  # branch on our own fork instead: that branch adds real per-token
  # confidence (responseConfidence) and best-of-N branch preview
  # generation on top of the same 0.8.24 base — neither exists upstream
  # yet. This means the app no longer auto-tracks pub.dev's llamadart
  # releases; pulling a newer pub.dev release back in means rebasing the
  # fork branch on it first.
  llamadart:
    git:
      url: https://github.com/Auseven9/llamadart
      ref: feature/response-confidence-and-best-of-n

  # ── State Management ────────────────────────────────────────────
  get: ^4.7.2                      # GetX - controllers, routing, state

  # ── Local Storage ───────────────────────────────────────────────
  hive_flutter: ^1.1.0             # Hive with Flutter init helpers
  hive: ^2.2.3                     # Hive core key-value + box storage

  # ── Networking / Downloads ──────────────────────────────────────
  http: ^1.2.2                     # HTTP requests + model downloading

  # ── File System ─────────────────────────────────────────────────
  path_provider: ^2.1.5            # App documents / downloads dir
  path: ^1.9.1                     # Path string utilities
  file_picker: ^8.1.7              # Cross-platform file/folder picker

  # ── UI Helpers ───────────────────────────────────────────────────
  flutter_markdown: ^0.7.6         # Render AI markdown responses
  google_fonts: ^6.2.1             # Inter font (matching FastChatUI)
  percent_indicator: ^4.2.4        # Download progress bars
  flutter_animate: ^4.5.0          # Micro-animations
  cupertino_icons: ^1.0.8

  # ── Background / Wake Lock ─────────────────────────────────────
  wakelock_plus: ^1.2.10             # Keep screen on during downloads
  flutter_foreground_task: ^9.2.2    # Foreground service for downloads/inference
  disable_battery_optimization: ^1.1.1 # Guide users to disable battery optimization

dev_dependencies:
  flutter_test:
    sdk: flutter
  hive_generator: ^2.0.1           # Hive type adapter code gen
  build_runner: ^2.4.13            # Code generation runner
  flutter_lints: ^6.0.0

hooks:
  user_defines:
    llamadart:
      llamadart_native_backends:
        platforms:
          linux-x64: [vulkan]
          windows-x64: [vulkan]
          android-arm64: [cpu, vulkan, opencl]

flutter:
  uses-material-design: true
  assets:
    - assets/models_catalog.json
